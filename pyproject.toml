[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conseek-knowledge-fabric"
version = "0.1.0"
description = "Evidence-grounded code knowledge extraction and Serenity responses"
requires-python = ">=3.11"
dependencies = [
	"tree-sitter>=0.25",
	"tree-sitter-python>=0.23",
	"tree-sitter-javascript>=0.23",
	"tree-sitter-typescript>=0.23",
	"tree-sitter-java>=0.23",
	"tree-sitter-go>=0.23",
	"tree-sitter-rust>=0.23",
	"python-dotenv>=1.0",
	"PyYAML>=6.0",
	"neo4j>=5.20",
	"fastapi>=0.115",
	"uvicorn>=0.30",
	"graphifyy",
	"requests",
	"litellm",
	"redis>=5.0"
]

[project.optional-dependencies]
test = ["httpx>=0.27"]

[project.scripts]
conseek-extract = "conseek_knowledge_fabric.cli:main"
conseek-ast = "conseek_knowledge_fabric.ast_cli:main"
conseek-web = "conseek_knowledge_fabric.app.main:main"
conseek-ba = "conseek_knowledge_fabric.ba_agent:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
conseek_knowledge_fabric = ["security_rules.yml", "static/*.html"]