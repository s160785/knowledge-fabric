<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BA Agent Chat · Code Knowledge Graph</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <style>
    :root{color-scheme:light;--ink:#202b28;--muted:#64716b;--paper:#f1f4ef;--panel:#fff;--line:#d8e0d8;--green:#176a51;--green-dark:#10513e;--green-soft:#e5f0e8;--orange:#b85d2b;--shadow:0 18px 50px #18352812}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    header{height:62px;padding:0 26px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:11px;font-weight:700;text-decoration:none;color:var(--ink)}.glyph{width:30px;height:30px;border-radius:7px;background:var(--green);color:#fff;display:grid;place-items:center;font:700 12px ui-monospace,monospace}.nav-actions{display:flex;align-items:center;gap:12px}
    main{max-width:1180px;margin:0 auto;padding:24px 22px 40px}
    .layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px;align-items:start}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:7px;box-shadow:var(--shadow)}
    .panel-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
    .panel-head h2{margin:0;font-size:13px;font-weight:700}
    .panel-head small{color:var(--muted);font-size:11px}
    .btn{height:34px;padding:0 12px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--ink);font-size:12px;font-weight:650;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
    .btn:hover{background:#f7f9f7}
    .btn-primary{background:var(--green);color:#fff;border-color:var(--green)}
    .btn-primary:hover{background:var(--green-dark)}
    .session-list{list-style:none;margin:0;padding:8px;max-height:360px;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
    .session-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;border-radius:5px;cursor:pointer;border:1px solid transparent;font-size:12px}
    .session-item:hover{background:#f4f7f3}
    .session-item.active{background:var(--green-soft);border-color:var(--green);color:var(--green-dark);font-weight:650}
    .session-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
    .session-del{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:14px;padding:2px 5px;border-radius:4px;line-height:1}
    .session-del:hover{background:#fdecea;color:#b42318}
    .conn-body{padding:14px 16px;border-top:1px solid var(--line)}
    .conn-body summary{cursor:pointer;font-size:12px;font-weight:650;color:var(--ink);user-select:none}
    .field{margin-top:10px}
    .field label{display:block;margin-bottom:4px;font-size:11px;font-weight:650;color:var(--muted)}
    .field input{width:100%;height:34px;padding:0 10px;border:1px solid #cbd6ce;border-radius:4px;font:12px ui-sans-serif,system-ui,sans-serif;outline:none}
    .field input:focus{border-color:var(--green);box-shadow:0 0 0 3px #176a5115}
    .chat-panel{display:flex;flex-direction:column;height:calc(100vh - 140px);min-height:520px}
    .chat-messages{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
    .chat-message{display:flex;flex-direction:column;gap:4px;max-width:85%}
    .chat-message.user{align-self:flex-end}
    .chat-message.assistant{align-self:flex-start}
    .chat-bubble{padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.55;overflow-wrap:anywhere}
    .chat-message.user .chat-bubble{background:var(--green);color:#fff;border-bottom-right-radius:4px;white-space:pre-wrap}
    .chat-message.assistant .chat-bubble{background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
    .chat-bubble p{margin:0 0 8px}
    .chat-bubble p:last-child{margin-bottom:0}
    .chat-bubble ul,.chat-bubble ol{margin:4px 0 8px 18px;padding:0}
    .chat-bubble li{margin-bottom:4px}
    .chat-bubble h1,.chat-bubble h2,.chat-bubble h3,.chat-bubble h4{margin:10px 0 6px;font-size:14px;line-height:1.3}
    .chat-bubble h1:first-child,.chat-bubble h2:first-child,.chat-bubble h3:first-child{margin-top:0}
    .chat-bubble code{padding:1px 5px;background:#f1f4ef;border:1px solid #e2e8e2;border-radius:4px;font:12px ui-monospace,monospace}
    .chat-bubble pre{margin:8px 0;padding:10px;background:#1e2623;color:#eef3ef;border-radius:6px;overflow-x:auto}
    .chat-bubble pre code{padding:0;background:transparent;border:0;color:inherit}
    .chat-meta{font-size:11px;color:var(--muted)}
    .chat-message.user .chat-meta{text-align:right}
    .chat-suggestions{display:flex;flex-wrap:wrap;gap:8px;padding:0 18px 12px}
    .suggestion-chip{padding:6px 12px;border:1px solid var(--line);border-radius:20px;background:#fff;color:var(--ink);font-size:12px;cursor:pointer}
    .suggestion-chip:hover{background:var(--green-soft);border-color:var(--green);color:var(--green)}
    .chat-input-area{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:8px}
    .chat-input-area textarea{flex:1;min-height:42px;max-height:120px;padding:10px 12px;border:1px solid #cbd6ce;border-radius:8px;font:13px ui-sans-serif,system-ui,sans-serif;outline:none;resize:vertical}
    .chat-input-area textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px #176a5115}
    .chat-input-area button{height:42px;padding:0 18px;border:0;border-radius:8px;background:var(--green);color:#fff;font-size:12px;font-weight:700;cursor:pointer;align-self:flex-end}
    .chat-input-area button:hover{background:var(--green-dark)}
    .chat-input-area button:disabled{opacity:.6;cursor:wait}
    .evidence-toggle{font-size:11px;color:var(--muted);cursor:pointer;margin-top:2px;display:inline-flex;align-items:center;gap:4px}
    .evidence-toggle:hover{color:var(--green)}
    .evidence-panel{margin-top:6px;padding:10px;background:#f4f7f3;border:1px solid var(--line);border-radius:6px;font:11px/1.4 ui-monospace,monospace;max-height:200px;overflow:auto}
    .evidence-item{padding:6px 0;border-bottom:1px solid #e2e8e2}
    .evidence-item:last-child{border-bottom:0}
    .spinner{display:inline-block;width:14px;height:14px;border:2px solid #176a5170;border-top-color:#176a51;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-3px;margin-right:7px}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:780px){.layout{grid-template-columns:1fr}.chat-panel{height:auto;min-height:420px}}
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/"><span class="glyph">KF</span><span>Code Knowledge Graph · BA Agent</span></a>
    <div class="nav-actions">
      <a class="btn" href="/live-coding">Live Coding</a>
      <a class="btn" href="/">← Graph Builder</a>
    </div>
  </header>
  <main>
    <div class="layout">
      <aside class="panel">
        <div class="panel-head">
          <h2>Sessions</h2>
          <button class="btn btn-primary" id="new-session-btn" type="button">+ New Chat</button>
        </div>
        <ul class="session-list" id="session-list"></ul>
        <details class="conn-body">
          <summary>Neo4j Connection (optional if set in .env)</summary>
          <div class="field"><label for="bolt">Bolt URI</label><input id="bolt" value="bolt://localhost:7687"></div>
          <div class="field"><label for="database">Database</label><input id="database" placeholder="neo4j"></div>
          <div class="field"><label for="username">Username</label><input id="username" value="neo4j"></div>
          <div class="field"><label for="password">Password</label><input id="password" type="password" placeholder="Uses server .env if blank"></div>
        </details>
      </aside>

      <section class="panel chat-panel">
        <div class="panel-head">
          <div>
            <h2 id="active-session-title">BA Agent Chat</h2>
            <small id="active-session-id"></small>
          </div>
          <button class="btn" id="clear-session-btn" type="button">Clear history</button>
        </div>
        <div id="chat-messages" class="chat-messages"></div>
        <div class="chat-suggestions" id="chat-suggestions">
          <button class="suggestion-chip" data-question="What are the entry points?">Entry points</button>
          <button class="suggestion-chip" data-question="What is the overall scope and architecture of this project?">Project scope</button>
          <button class="suggestion-chip" data-question="What are the main workflows in the repository?">Main workflows</button>
        </div>
        <div class="chat-input-area">
          <textarea id="chat-input" placeholder="Ask a question about your repository..." rows="1"></textarea>
          <button id="chat-send" type="button">Send</button>
        </div>
      </section>
    </div>
  </main>
  <script>
    const STORAGE_KEY = 'codefabric_ba_sessions_v1';
    const ACTIVE_KEY = 'codefabric_ba_active_session_v1';
    const GREETING = "Hello! I'm the BA Agent. Ask me questions about your repository like \"What are the entry points?\", \"What is the project scope?\", or \"What are the main workflows?\".";

    const sessionListEl = document.querySelector('#session-list');
    const newSessionBtn = document.querySelector('#new-session-btn');
    const clearSessionBtn = document.querySelector('#clear-session-btn');
    const activeTitleEl = document.querySelector('#active-session-title');
    const activeIdEl = document.querySelector('#active-session-id');
    const chatMessages = document.querySelector('#chat-messages');
    const chatInput = document.querySelector('#chat-input');
    const chatSend = document.querySelector('#chat-send');
    const chatSuggestions = document.querySelector('#chat-suggestions');

    let sessions = loadSessions();
    let activeSessionId = localStorage.getItem(ACTIVE_KEY) || (sessions[0] && sessions[0].id);
    if (!sessions.length || !sessions.some(s => s.id === activeSessionId)) {
      const created = createSessionObject();
      sessions.unshift(created);
      activeSessionId = created.id;
      saveSessions();
    }

    function createSessionObject() {
      const id = 'sess-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 6);
      return { id, title: 'New conversation', messages: [{ role: 'assistant', content: GREETING }] };
    }

    function loadSessions() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      } catch {
        return [];
      }
    }

    function saveSessions() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions));
      localStorage.setItem(ACTIVE_KEY, activeSessionId);
    }

    function getActiveSession() {
      return sessions.find(s => s.id === activeSessionId);
    }

    function renderSessionList() {
      sessionListEl.innerHTML = '';
      for (const s of sessions) {
        const li = document.createElement('li');
        li.className = 'session-item' + (s.id === activeSessionId ? ' active' : '');
        const title = document.createElement('span');
        title.className = 'session-title';
        title.textContent = s.title;
        const del = document.createElement('button');
        del.className = 'session-del';
        del.title = 'Delete session';
        del.textContent = '×';
        del.addEventListener('click', async e => {
          e.stopPropagation();
          await deleteSession(s.id);
        });
        li.append(title, del);
        li.addEventListener('click', () => switchSession(s.id));
        sessionListEl.append(li);
      }
    }

    function renderActiveSession() {
      const session = getActiveSession();
      if (!session) return;
      activeTitleEl.textContent = session.title;
      activeIdEl.textContent = `Session: ${session.id}`;
      chatMessages.innerHTML = '';
      for (const msg of session.messages) {
        appendMessageDOM(msg.role, msg.content, msg.evidence);
      }
      renderSessionList();
    }

    function appendMessageDOM(role, content, evidence = null) {
      const wrapper = document.createElement('div');
      wrapper.className = `chat-message ${role}`;
      const bubble = document.createElement('div');
      bubble.className = 'chat-bubble';
      if (role === 'assistant' && window.marked) {
        const html = marked.parse(String(content || ''), { breaks: true });
        bubble.innerHTML = window.DOMPurify ? DOMPurify.sanitize(html) : html;
      } else {
        bubble.textContent = content;
      }
      const meta = document.createElement('div');
      meta.className = 'chat-meta';
      meta.textContent = role === 'user' ? 'You' : 'BA Agent';
      wrapper.append(bubble, meta);

      if (evidence && evidence.length > 0) {
        const toggle = document.createElement('div');
        toggle.className = 'evidence-toggle';
        toggle.innerHTML = `<span>▸</span> Show evidence (${evidence.length} items)`;
        const panel = document.createElement('div');
        panel.className = 'evidence-panel';
        panel.style.display = 'none';
        evidence.forEach(item => {
          const itemDiv = document.createElement('div');
          itemDiv.className = 'evidence-item';
          itemDiv.textContent = `${item.symbol || item.name || item.file || 'Symbol'} (${item.file || ''}): ${item.symbol_summary || ''}`;
          panel.append(itemDiv);
        });
        toggle.addEventListener('click', () => {
          const isOpen = panel.style.display !== 'none';
          panel.style.display = isOpen ? 'none' : 'block';
          toggle.querySelector('span').textContent = isOpen ? '▸' : '▾';
        });
        wrapper.append(toggle, panel);
      }
      chatMessages.append(wrapper);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function switchSession(id) {
      activeSessionId = id;
      saveSessions();
      renderActiveSession();
    }

    async function deleteSession(id) {
      fetch(`/api/ba-chat/sessions/${encodeURIComponent(id)}`, { method: 'DELETE' }).catch(() => {});
      sessions = sessions.filter(s => s.id !== id);
      if (!sessions.length) {
        sessions.push(createSessionObject());
      }
      if (activeSessionId === id) {
        activeSessionId = sessions[0].id;
      }
      saveSessions();
      renderActiveSession();
    }

    newSessionBtn.addEventListener('click', () => {
      const created = createSessionObject();
      sessions.unshift(created);
      switchSession(created.id);
    });

    clearSessionBtn.addEventListener('click', async () => {
      const session = getActiveSession();
      if (!session) return;
      await fetch(`/api/ba-chat/sessions/${encodeURIComponent(session.id)}`, { method: 'DELETE' }).catch(() => {});
      session.messages = [{ role: 'assistant', content: GREETING }];
      session.title = 'New conversation';
      saveSessions();
      renderActiveSession();
    });

    function getConnectionConfig() {
      const cfg = {
        neo4j_uri: document.querySelector('#bolt').value.trim() || 'bolt://localhost:7687',
        neo4j_username: document.querySelector('#username').value.trim() || 'neo4j',
      };
      const db = document.querySelector('#database').value.trim();
      if (db) cfg.neo4j_database = db;
      const pw = document.querySelector('#password').value;
      if (pw) cfg.neo4j_password = pw;
      return cfg;
    }

    async function sendQuestion(question) {
      const session = getActiveSession();
      if (!session) return;

      chatInput.value = '';
      chatInput.style.height = 'auto';
      chatSend.disabled = true;

      if (session.title === 'New conversation') {
        session.title = question.slice(0, 38) + (question.length > 38 ? '…' : '');
      }
      session.messages.push({ role: 'user', content: question });
      saveSessions();
      renderSessionList();
      activeTitleEl.textContent = session.title;
      appendMessageDOM('user', question);

      const typingDiv = document.createElement('div');
      typingDiv.className = 'chat-message assistant';
      typingDiv.innerHTML = '<div class="chat-bubble"><span class="spinner"></span>Thinking…</div><div class="chat-meta">BA Agent</div>';
      chatMessages.append(typingDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;

      try {
        const response = await fetch('/api/ba-chat', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({
            question,
            session_id: session.id,
            ...getConnectionConfig(),
          }),
        });
        const payload = await response.json();
        typingDiv.remove();
        if (!response.ok) throw new Error(payload.detail || 'Chat request failed');
        session.messages.push({ role: 'assistant', content: payload.answer, evidence: payload.evidence });
        saveSessions();
        appendMessageDOM('assistant', payload.answer, payload.evidence);
      } catch (error) {
        if (typingDiv.parentNode) typingDiv.remove();
        const errMsg = 'Error: ' + error.message;
        session.messages.push({ role: 'assistant', content: errMsg });
        saveSessions();
        appendMessageDOM('assistant', errMsg);
      } finally {
        chatSend.disabled = false;
      }
    }

    chatSend.addEventListener('click', () => {
      const q = chatInput.value.trim();
      if (q) sendQuestion(q);
    });

    chatInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        const q = chatInput.value.trim();
        if (q) sendQuestion(q);
      }
    });

    chatInput.addEventListener('input', () => {
      chatInput.style.height = 'auto';
      chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + 'px';
    });

    chatSuggestions.addEventListener('click', e => {
      const chip = e.target.closest('.suggestion-chip');
      if (chip) sendQuestion(chip.dataset.question);
    });

    renderActiveSession();
  </script>
</body>
</html>
